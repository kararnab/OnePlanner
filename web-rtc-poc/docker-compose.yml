version: '3.8'

services:
  webrtc:
    build: .
    container_name: webrtc-backend
    restart: unless-stopped
    depends_on:
      - livekit
      - redis
    volumes:
      - ./configs/config.yaml:/etc/chatcore/config.yaml:ro
    environment:
      # Ensure backend reads correct location
      CONFIG_PATH: /etc/chatcore/config.yaml
    ports:
      - "8080:8080"
    networks:
      - internal


  ###########################
  #  LIVEKIT SFU
  ###########################
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - ./infra-deploy/livekit-config.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml
    ports:
      - "7880:7880"   # LiveKit API + WebSocket (wss/ ws)
      - "50000-50020:50000-50020/udp"   # WebRTC RTP Media UDP, Windows allows small ranges, linux allows big range like 50000-60000
    networks:
      - internal

  ###########################
  #  REDIS (Required by LiveKit)
  ###########################
  redis:
    image: redis:6-alpine
    container_name: livekit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal

  ############################################
  # Nginx Reverse Proxy (TLS + WebSocket)
  ############################################
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./infra-deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra-deploy/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - webrtc
      - livekit
    networks:
      - internal


  coturn:
    image: instrumentisto/coturn
    container_name: coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"       # Not needed now, later if using tls
      - "49160:49160/udp"
      - "49161:49161/udp"
      - "49162:49162/udp"
      - "49163:49163/udp"
      - "49164:49164/udp"
      - "49165:49165/udp"
      - "49166:49166/udp"
      - "49167:49167/udp"
      - "49168:49168/udp"
      - "49169:49169/udp"
      - "49170:49170/udp"
      - "49171:49171/udp"
      - "49172:49172/udp"
      - "49173:49173/udp"
      - "49174:49174/udp"
      - "49175:49175/udp"
      - "49176:49176/udp"
      - "49177:49177/udp"
      - "49178:49178/udp"
      - "49179:49179/udp"
      - "49180:49180/udp"
# Doesn't work reliably on windows, added manually above "49160-49180:49160-49180/udp"
    volumes:
      - ./infra-deploy/coturn.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - internal

###########################################################
# NETWORK
###########################################################
networks:
  internal:
    driver: bridge