#############################
# coturn - basic, air-gapped
#############################

# Logging
log-file=stdout
verbose
fingerprint

use-auth-secret
static-auth-secret=s3cr3t
realm=192.168.29.234

#################################
# PORTS
#################################
listening-port=3478
listening-ip=0.0.0.0

# REQUIRED FOR DOCKER
min-port=49160
max-port=49180

#############################
# RELAY NETWORK CONFIG
#############################

# The address TURN gives clients for relayed traffic
# This must be the HOST machine's LAN IP address (not container IP!)
# XXX.XXX.XX.XXX/XXX.XX.X.X NAT mapping format
# docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' coturn
external-ip=192.168.29.234/172.18.0.3

# The IP the TURN server allocates relayed connections on.
# Also should be host LAN IP for correct NAT routing.
relay-ip=172.18.0.3

# Allow UDP relay (required)
no-tls

#############################
# PERFORMANCE
#############################

# Prevent stale allocations
stale-nonce=600

# Keep relay allocations alive
user-quota=0
total-quota=0