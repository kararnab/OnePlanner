############################################
# WebRTC + LiveKit Reverse Proxy
############################################

# Required for WebSocket upgrades
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;


    ####################################################
    # 1. WebRTC Backend WS (signaling)
    ####################################################
    location /ws {
        proxy_pass http://webrtc-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }


    ####################################################
    # 2. LiveKit signaling + REST endpoints at /rtc
    ####################################################
    location /rtc {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    ####################################################
    # 3. Default = WebRTC Backend UI/API
    ####################################################
    location / {
        proxy_pass http://webrtc-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    ####################################################
    # Optional TURN credentials endpoint
    ####################################################
    location /turn-credentials {
        proxy_pass http://webrtc-backend:8080;
    }
}

############################################
# HTTP → HTTPS Redirect
############################################
server {
    listen 80;
    return 301 https://$host$request_uri;
}
